# One Backtrack agent. Deploy one per Docker host; set HUB=true on exactly one of them
# (see compose.hub.yaml for the extra settings the hub needs).
name: backtrack
services:
  agent:
    image: ghcr.io/sloraris/backtrack:0.4.1
    container_name: backtrack      # `docker exec backtrack backtrack auto-restore <stack>` relies on this name
    restart: unless-stopped
    # A restore must not be cut in half: give the running job time to finish on shutdown.
    stop_grace_period: 10m
    environment:
      MACHINE: alpha
      AGENT_URL: https://backup-alpha.example.com
      TZ: Etc/UTC
      # Secrets: ${VAR} here, values from your secrets file (SOPS, .env, ...), never in this file.
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      CLUSTER_KEY: ${CLUSTER_KEY}                 # same on every agent; only the hub uses it
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      HEARTBEAT_URL: ${HEARTBEAT_URL}             # one Uptime Kuma push monitor per host, interval ~26 h
      # MAINTENANCE: "true"                       # the one agent that prunes, when no hub assigns it
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # discover stacks, stop/start them, run post-restore helpers
      - /opt/appdata:/opt/appdata                 # same path inside and out, so snapshot paths match the host
      - /opt/cache/backtrack:/opt/cache/backtrack # restic cache and restore-test scratch
      - nas:/share                                # the shared restic repo (/share/restic) and presence files
    labels:
      - traefik.enable=true
      - traefik.http.routers.backup-alpha.rule=Host(`backup-alpha.example.com`)
      - traefik.http.services.backup-alpha.loadbalancer.server.port=8080
      - traefik.docker.network=traefik
    networks:
      - traefik

volumes:
  # An NFS mount defined in compose, so the host needs no fstab entry. It stores nothing itself.
  # restic keeps file owners in its own metadata, so root squash on the NAS is fine as long as the
  # export is writable by the squashed user.
  nas:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.0.2.10,nfsvers=4.1,hard,timeo=600,retrans=3
      device: ":/volume/backups"

networks:
  traefik:
    external: true
