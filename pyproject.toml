[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrack"
version = "0.1.1"
description = "Back up Docker Compose stacks with restic: one agent per host, one shared repo, an optional hub."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
backtrack = "backtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backtrack = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
